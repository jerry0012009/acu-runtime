name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and frontend
        shell: bash
        run: |
          version=$(sed -n 's/^const appVersion = "\([^"]*\)"/\1/p' update.go)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          node --check web/app.js
          node --check web/billing.js
          node --check web/preferences.js
          node --check web/work-review.js
          node --check web/preference-starfish.js
          node --test tests/*.test.cjs
      - name: Test Go and native desktop
        shell: bash
        run: |
          go test ./...
          go test -tags desktop,production ./...
          go vet -tags desktop,production ./...
      - name: Verify official WorkBuddy installation on clean runner
        env:
          ACU_AGENT_INSTALL_SMOKE: '1'
        shell: bash
        run: go test -run '^TestOfficialWorkBuddyInstallSmoke$' -v -timeout 25m .
      - name: Verify preference page in both themes and all widths
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/acu-preference-browser" playwright
          node "$RUNNER_TEMP/acu-preference-browser/node_modules/playwright/cli.js" install chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/acu-preference-browser/node_modules/playwright"
          export ACU_TEST_WORKSPACE="$RUNNER_TEMP/acu-preference-browser"
          node scripts/test-preferences.cjs
          node scripts/test-starfish.cjs
          node scripts/test-billing.cjs
          node scripts/test-install-updates.cjs
          node scripts/test-recommended-models.cjs
          node scripts/test-work-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preference-screenshots-${{ matrix.platform }}
          path: ${{ runner.temp }}/acu-preference-browser/output/runtime-preferences/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-review-screenshots-${{ matrix.platform }}
          path: ${{ runner.temp }}/acu-preference-browser/output/runtime-work-review/*.png
          if-no-files-found: ignore
      - name: Verify native Windows preference page and session renewal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -c -tags desktop,production -o "$env:RUNNER_TEMP/preferences-native-smoke.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/acu-preference-browser/node_modules/playwright"
          $env:ACU_TEST_WORKSPACE = "$env:RUNNER_TEMP/acu-preference-browser"
          $env:ACU_NATIVE_TEST_EXE = "$env:RUNNER_TEMP/preferences-native-smoke.exe"
          node scripts/test-native-login.cjs
          node scripts/test-native-restore.cjs
          $env:ACU_NATIVE_STARFISH_MODE = "bipolar"
          $env:ACU_NATIVE_INSPECT_PORT = "9236"
          node scripts/test-native-login.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starfish-screenshots-${{ matrix.platform }}
          path: ${{ runner.temp }}/acu-preference-browser/output/runtime-starfish/*.png
          if-no-files-found: ignore
      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          go test -tags setup ./cmd/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = [regex]::Match((Get-Content update.go -Raw), 'const appVersion = "([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item -LiteralPath 'dist/windows-amd64/ACU Runtime Setup.exe' -Destination "dist/release/ACU-Runtime-$version-windows-amd64-Setup.exe"
      - name: Verify ChatGPT first installation on clean Windows
        if: runner.os == 'Windows'
        env:
          ACU_CHATGPT_INSTALL_SMOKE: '1'
        shell: pwsh
        run: go test -run '^TestOfficialChatGPTInstallSmoke$' -v -timeout 35m .
      - name: Verify quiet Codex routing with the installed native CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ACU_QUIET_CODEX_SMOKE: '1'
        run: |
          $env:ACU_QUIET_KERNEL = (Resolve-Path 'dist/windows-amd64/kernel/acu-kernel.exe').Path
          go test -run '^TestQuietCodexNativeIsolation$' -v -timeout 4m .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke test native macOS app
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-macos.sh
      - name: Verify published Runtime upgrade and matching kernel on clean Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/download-release.py jerry0012009/acu-runtime v0.1.70 ACU-Runtime-0.1.70-windows-amd64-Setup.exe bda3e5815402b3286131a332962254906c8603dcb4cd64cfc025ccb94eacaf86 dist/previous-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-windows-install.ps1 -Installer 'dist/windows-amd64/ACU Runtime Setup.exe' -PreviousInstaller 'dist/previous-setup.exe'
      - name: Verify packaged kernel and Runtime API compatibility
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            kernel='dist/windows-amd64/kernel/acu-kernel.exe'
          else
            arch=$(go env GOARCH)
            kernel="dist/darwin-$arch/ACU Runtime.app/Contents/MacOS/kernel/acu-kernel"
          fi
          go build -o dist/compat-runtime .
          python3 scripts/test-kernel-compatibility.py "$kernel" dist/compat-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: "@(windows-amd64|macos-arm64|macos-amd64)"
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cp ../RELEASE-NOTES.md INSTALL.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ACU Runtime ${GITHUB_REF_NAME#v}" --notes-file ../RELEASE-NOTES.md --draft ./*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
