name: Desktop release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate version and frontend
        shell: bash
        run: |
          version=$(sed -n 's/^const appVersion = "\([^"]*\)"/\1/p' update.go)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          node --check web/app.js
          node --test tests/*.test.cjs
      - name: Test Go and native desktop
        shell: bash
        run: |
          go test ./...
          go test -tags desktop,production ./...
          go vet -tags desktop,production ./...
      - name: Verify official WorkBuddy installation on clean runner
        env:
          ACU_AGENT_INSTALL_SMOKE: '1'
        shell: bash
        run: go test -run '^TestOfficialWorkBuddyInstallSmoke$' -v -timeout 25m .
      - name: Package Windows installer
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          $version = [regex]::Match((Get-Content update.go -Raw), 'const appVersion = "([^"]+)"').Groups[1].Value
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item -LiteralPath 'dist/windows-amd64/ACU Runtime Setup.exe' -Destination "dist/release/ACU-Runtime-$version-windows-amd64-Setup.exe"
      - name: Package and smoke test native macOS app
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cp ../RELEASE-NOTES.md INSTALL.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "ACU Runtime ${GITHUB_REF_NAME#v}" --notes-file ../RELEASE-NOTES.md --draft ./*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
